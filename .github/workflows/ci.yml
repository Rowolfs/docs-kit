name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  yaml-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install YAML linter
        run: python -m pip install -r requirements-dev.txt
      - name: Lint workflow YAML
        run: make lint-yaml PYTHON=python

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        run: python -m pip install -r requirements.lock
      - name: Check builder contracts
        run: make test PYTHON=python

  browser-test:
    needs: unit-test
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            demo/requirements-browser.txt
      - name: Install browser test dependencies
        run: |
          python -m pip install -r requirements.lock -r demo/requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Build the independent demo project
        run: make demo PYTHON=python
      - name: Check the built demo in Chromium
        run: |
          python -m http.server 8766 --bind 127.0.0.1 --directory build/demo &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8766/docs-kit/ > /dev/null
          python demo/check_browser.py
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: browser-evidence
          path: build/phase1

  reusable-build:
    needs: [yaml-lint, unit-test, browser-test]
    permissions:
      contents: read
      pages: read
    uses: ./.github/workflows/build.yml
    with:
      project-directory: demo
