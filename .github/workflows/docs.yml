name: Documentation

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-kit-documentation
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    uses: Rowolfs/docs-kit/.github/workflows/build.yml@v0.2.0-alpha.1
    with:
      source-ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      deploy: true
